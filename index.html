<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipificación de Incidencias - Call Center</title>
<style>
  :root {
    --corp-900: #0b1f37;
    --corp-800: #123258;
    --corp-700: #164a86;
    --corp-600: #1a5fb4;
    --corp-050: #f4f8fd;
    --gray-900: #1c2733;
    --gray-700: #44515f;
    --gray-500: #6b7885;
    --gray-300: #d3dae2;
    --gray-200: #e4e9ef;
    --gray-100: #f2f5f8;
    --white: #fff;
    --danger: #b42318;
    --danger-050: #fdf0f0;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(11, 31, 55, .07), 0 4px 14px rgba(11, 31, 55, .05);
    --font: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--gray-100);
    color: var(--gray-900);
    min-height: 100vh;
    padding: 28px 16px;
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap { max-width: 920px; margin: 0 auto; }

  header {
    background: var(--corp-900);
    border: 1px solid var(--corp-800);
    color: var(--white);
    border-radius: var(--radius);
    padding: 18px 24px;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: var(--shadow);
  }
  header .logo {
    background: rgba(255, 255, 255, .1);
    border: 1px solid rgba(255, 255, 255, .18);
    border-radius: var(--radius);
    padding: 10px;
    font-size: 26px;
    line-height: 1;
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: .01em; }
  header p { font-size: 12.5px; color: rgba(255, 255, 255, .72); }

  .card {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 22px;
  }
  .card h2 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--corp-800);
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--gray-200);
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--gray-200);
  }
  .card-head h2 { margin: 0; padding: 0; border: none; }

  .filtro {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    padding: 12px 14px;
    background: var(--corp-050);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
  }
  .filtro .field { min-width: 150px; }
  .filtro-info {
    align-self: center;
    font-size: 13px;
    color: var(--gray-500);
    margin-left: auto;
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 12.5px; font-weight: 600; color: var(--gray-700); }
  label .req { color: var(--danger); }

  input, select, textarea {
    border: 1px solid var(--gray-300);
    border-radius: 6px;
    padding: 9px 11px;
    font-size: 14px;
    font-family: inherit;
    background: var(--white);
    color: var(--gray-900);
    width: 100%;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder, textarea::placeholder { color: #9aa5b1; }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--corp-600);
    box-shadow: 0 0 0 3px rgba(26, 95, 180, .14);
  }
  textarea { resize: vertical; min-height: 90px; }

  .btn {
    background: var(--white);
    border: 1px solid var(--gray-300);
    border-radius: 6px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    color: var(--gray-700);
    transition: background-color .15s, border-color .15s, box-shadow .15s;
  }
  .btn:hover { background: var(--gray-100); border-color: var(--gray-500); }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--corp-700);
    border-color: var(--corp-700);
    color: var(--white);
    box-shadow: 0 1px 2px rgba(11, 31, 55, .18);
  }
  .btn-primary:hover { background: var(--corp-600); border-color: var(--corp-600); }
  .btn-secondary {
    background: var(--white);
    border-color: var(--gray-300);
    color: var(--gray-700);
  }
  .btn-secondary:hover { background: var(--gray-100); }

  .btn-mini {
    background: var(--white);
    border: 1px solid var(--gray-300);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    color: var(--corp-700);
    transition: background-color .15s, border-color .15s, color .15s;
  }
  .btn-mini:hover { background: var(--corp-050); border-color: var(--corp-600); }
  .btn-mini.btn-elim {
    background: var(--white);
    border-color: var(--gray-300);
    color: var(--danger);
    margin-left: 6px;
  }
  .btn-mini.btn-elim:hover { background: var(--danger-050); border-color: var(--danger); }

  .form-actions { margin-top: 18px; display: flex; justify-content: flex-end; gap: 10px; }

  .toast {
    display: none;
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--corp-900);
    color: var(--white);
    border-radius: 6px;
    padding: 11px 18px;
    font-size: 13.5px;
    box-shadow: 0 6px 20px rgba(11, 31, 55, .28);
    z-index: 100;
  }
  .toast.error { background: var(--danger); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--gray-200); vertical-align: middle; }
  th {
    background: var(--corp-050);
    color: var(--gray-700);
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    border-bottom: 2px solid var(--gray-200);
    white-space: nowrap;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--corp-050); }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .02em;
    border: 1px solid transparent;
  }
  .sev-baja { background: #e9f7ee; color: #157a3a; border-color: #c6ebd3; }
  .sev-media { background: #fdf5e3; color: #92400e; border-color: #f4e3b8; }
  .sev-alta { background: #fdeceb; color: #b42318; border-color: #f6cdca; }
  .sev-critica { background: #f8e9ed; color: #7a1f2b; border-color: #ecc8d1; }
  .empty { text-align: center; color: var(--gray-500); padding: 28px 0; }

  .meta { font-size: 12px; color: var(--gray-500); }

  @media (max-width: 640px) {
    body { padding: 16px 10px; }
    .grid { grid-template-columns: 1fr; }
    .card { padding: 18px 16px; }
    header { padding: 16px; }
    .card-head { flex-wrap: wrap; }
    .form-actions { flex-wrap: wrap; }
    .form-actions .btn { flex: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🎧</div>
    <div>
      <h1>Tipificación de Incidencias</h1>
      <p>Registro y clasificación de incidencias para el call center</p>
    </div>
  </header>

  <form id="formulario" class="card" novalidate>
    <h2>Nueva incidencia</h2>
    <div class="grid">
      <div class="field">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>
      </div>
      <div class="field">
        <label for="hora">Hora <span class="req">*</span></label>
        <input type="time" id="hora" required>
      </div>
      <div class="field">
        <label for="canal">Canal de atención</label>
        <select id="canal" required>
          <option value="">Seleccionar...</option>
          <option>Teléfono</option>
          <option>Chat</option>
          <option>WhatsApp</option>
          <option>Email</option>
          <option>Web / Redes</option>
          <option>Presencial</option>
        </select>
      </div>
      <div class="field">
        <label for="agente">Agente</label>
        <input type="text" id="agente" placeholder="Nombre o código" required>
      </div>
      <div class="field">
        <label for="tipo">Tipo de incidencia</label>
        <input type="text" id="tipo" placeholder="Ej. Escalamiento, Queja por facturación..." required>
      </div>
      <div class="field">
        <label for="severidad">Severidad</label>
        <select id="severidad" required>
          <option value="">Seleccionar...</option>
          <option value="Baja">Baja</option>
          <option value="Media">Media</option>
          <option value="Alta">Alta</option>
          <option value="Crítica">Crítica</option>
        </select>
      </div>
      <div class="field">
        <label for="estado">Estado</label>
        <select id="estado" required>
          <option value="">Seleccionar...</option>
          <option>Abierta</option>
          <option>En proceso</option>
          <option>Resuelta</option>
          <option>Escalada</option>
          <option>Cerrada</option>
        </select>
      </div>
      <div class="field full">
        <label for="descripcion">Descripción de la incidencia</label>
        <textarea id="descripcion" placeholder="Describe brevemente el motivo del contacto y el detalle de la incidencia..." required></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button type="button" class="btn" id="btnCancelar" style="display:none;">Cancelar edición</button>
      <button type="button" class="btn" id="btnLimpiar">Limpiar</button>
      <button type="submit" class="btn btn-primary" id="btnGuardar">Registrar incidencia</button>
    </div>
  </form>

  <div class="card">
    <div class="card-head">
      <h2>Últimos registros</h2>
      <button type="button" class="btn btn-mini" id="btnExcel">Descargar Excel</button>
    </div>
    <div class="filtro">
      <div class="field">
        <label for="fDesde">Desde</label>
        <input type="date" id="fDesde">
      </div>
      <div class="field">
        <label for="fHasta">Hasta</label>
        <input type="date" id="fHasta">
      </div>
      <button type="button" class="btn btn-mini" id="btnFiltroLimpiar">Limpiar filtro</button>
      <span class="filtro-info" id="filtroInfo"></span>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Canal</th>
            <th>Agente</th>
            <th>Tipo</th>
            <th>Severidad</th>
            <th>Estado</th>
            <th>Descripción</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <p class="empty" id="empty" style="display:none;">Aún no hay incidencias registradas.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
const $ = id => document.getElementById(id);

let registros = [];
let editandoId = null;

function mostrarToast(msg, error = false) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast" + (error ? " error" : "");
  t.style.display = "block";
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = "none"; }, 3000);
}

function fechaHoy() {
  return new Date().toISOString().split("T")[0];
}

function horaAhora() {
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function esc(t) {
  const d = document.createElement("div");
  d.textContent = t == null ? "" : t;
  return d.innerHTML;
}

function badgeSeveridad(s) {
  const map = { "Baja": "sev-baja", "Media": "sev-media", "Alta": "sev-alta", "Crítica": "sev-critica" };
  return `<span class="badge ${map[s] || ""}">${esc(s)}</span>`;
}

function registrosFiltrados() {
  const desde = $("fDesde").value;
  const hasta = $("fHasta").value;
  if (!desde && !hasta) return registros;
  return registros.filter((r) => {
    if (desde && r.fecha < desde) return false;
    if (hasta && r.fecha > hasta) return false;
    return true;
  });
}

function renderLista() {
  const tbody = $("tbody");
  const desde = $("fDesde").value;
  const hasta = $("fHasta").value;
  const tieneFiltro = !!(desde || hasta);
  const filtrados = registrosFiltrados();
  $("empty").style.display = filtrados.length ? "none" : "block";
  $("empty").textContent = registros.length
    ? "No hay incidencias para el rango de fechas seleccionado."
    : "Aún no hay incidencias registradas.";
  $("filtroInfo").textContent = tieneFiltro ? filtrados.length + " resultado(s)" : "";
  tbody.innerHTML = "";
  const mostrar = tieneFiltro ? [...filtrados].reverse() : filtrados.slice(-10).reverse();
  for (const r of mostrar) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${esc(r.fecha)}</td>
      <td>${esc(r.hora)}</td>
      <td>${esc(r.canal)}</td>
      <td>${esc(r.agente)}</td>
      <td>${esc(r.tipo)}</td>
      <td>${badgeSeveridad(r.severidad)}</td>
      <td>${esc(r.estado)}</td>
      <td style="max-width:260px;">${esc((r.descripcion || "").slice(0, 60))}</td>
      <td><button type="button" class="btn-mini" data-accion="editar" data-id="${esc(r.id)}">Editar</button><button type="button" class="btn-mini btn-elim" data-accion="eliminar" data-id="${esc(r.id)}">Eliminar</button></td>`;
    tbody.appendChild(tr);
  }
}

async function cargarRegistros() {
  try {
    const res = await fetch("/api/incidencias");
    const data = await res.json();
    registros = data;
    renderLista();
  } catch (e) {
    mostrarToast("No se pudo leer los registros", true);
  }
}

function editarRegistro(id) {
  const r = registros.find((x) => x.id === id);
  if (!r) return;
  editandoId = id;
  $("fecha").value = r.fecha || "";
  $("hora").value = r.hora || "";
  $("canal").value = r.canal || "";
  $("agente").value = r.agente || "";
  $("tipo").value = r.tipo || "";
  $("severidad").value = r.severidad || "";
  $("estado").value = r.estado || "";
  $("descripcion").value = r.descripcion || "";
  $("btnGuardar").textContent = "Actualizar incidencia";
  $("btnCancelar").style.display = "inline-block";
  $("formulario").scrollIntoView({ behavior: "smooth" });
}

function cancelarEdicion() {
  editandoId = null;
  $("formulario").reset();
  $("fecha").value = fechaHoy();
  $("hora").value = horaAhora();
  $("btnGuardar").textContent = "Registrar incidencia";
  $("btnCancelar").style.display = "none";
}

$("tbody").addEventListener("click", (e) => {
  const btn = e.target.closest(".btn-mini");
  if (!btn) return;
  if (btn.dataset.accion === "eliminar") {
    eliminarRegistro(btn.dataset.id);
    return;
  }
  editarRegistro(btn.dataset.id);
});

async function eliminarRegistro(id) {
  const r = registros.find((x) => x.id === id);
  const etiqueta = r ? `${r.fecha} ${r.hora || ""} - ${r.tipo}` : "este registro";
  if (!confirm(`¿Eliminar ${etiqueta}? Esta acción no se puede deshacer.`)) return;
  try {
    const res = await fetch(`/api/incidencias/${encodeURIComponent(id)}`, { method: "DELETE" });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "Error");
    if (editandoId === id) cancelarEdicion();
    mostrarToast("Incidencia eliminada");
    cargarRegistros();
  } catch (err) {
    mostrarToast("Error al eliminar: " + err.message, true);
  }
}

$("formulario").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!$("hora").value) {
    mostrarToast("Debes indicar la hora de la incidencia", true);
    $("hora").focus();
    return;
  }
  const incidencia = {
    fecha: $("fecha").value,
    hora: $("hora").value,
    canal: $("canal").value,
    agente: $("agente").value.trim(),
    tipo: $("tipo").value.trim(),
    severidad: $("severidad").value,
    estado: $("estado").value,
    descripcion: $("descripcion").value.trim()
  };
  const url = editandoId ? `/api/incidencias/${editandoId}` : "/api/incidencias";
  const method = editandoId ? "PUT" : "POST";
  try {
    const res = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(incidencia)
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "Error");
    mostrarToast(editandoId ? "Incidencia actualizada" : "Incidencia registrada correctamente");
    cancelarEdicion();
    cargarRegistros();
  } catch (err) {
    mostrarToast("Error al guardar: " + err.message, true);
  }
});

$("btnCancelar").addEventListener("click", cancelarEdicion);

$("btnLimpiar").addEventListener("click", cancelarEdicion);

function descargarExcel() {
  if (typeof XLSX === "undefined") {
    mostrarToast("El módulo de Excel no cargó. Revisa tu conexión.", true);
    return;
  }
  if (!registros.length) {
    mostrarToast("No hay registros para exportar", true);
    return;
  }
  const filas = registros.map((r) => ({
    Fecha: r.fecha,
    Hora: r.hora,
    Canal: r.canal,
    Agente: r.agente,
    "Tipo de incidencia": r.tipo,
    Severidad: r.severidad,
    Estado: r.estado,
    Descripción: r.descripcion,
    Creado: (r.creado || "").replace("T", " ").slice(0, 19),
    Actualizado: (r.actualizado || "").replace("T", " ").slice(0, 19)
  }));
  const ws = XLSX.utils.json_to_sheet(filas);
  ws["!cols"] = [
    { wch: 12 }, { wch: 8 }, { wch: 12 }, { wch: 10 }, { wch: 22 },
    { wch: 10 }, { wch: 12 }, { wch: 40 },
    { wch: 20 }, { wch: 20 }
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Incidencias");
  XLSX.writeFile(wb, "reporte_incidencias_" + fechaHoy() + ".xlsx");
  mostrarToast("Reporte Excel descargado");
}

$("btnExcel").addEventListener("click", descargarExcel);

const aplicarFiltro = () => renderLista();
$("fDesde").addEventListener("change", aplicarFiltro);
$("fHasta").addEventListener("change", aplicarFiltro);
$("btnFiltroLimpiar").addEventListener("click", () => {
  $("fDesde").value = "";
  $("fHasta").value = "";
  renderLista();
});

$("fecha").value = fechaHoy();
$("hora").value = horaAhora();
cargarRegistros();
</script>
</body>
</html>
